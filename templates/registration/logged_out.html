{% extends "base.html" %}
{% block title %}Log Out{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card">
                    <div class="card-body p-4 text-center">
                        <span class="led led-success mb-3" style="display:inline-block;"></span>
                        <h2 class="card-title mb-3">Session Terminated</h2>
                        <p class="mb-4" style="color:#9DA7B3;">
                            Connection closed. Thanks for spending time on the workbench.
                        </p>
                        <div class="d-grid gap-2">
                            <a href="{% url 'login' %}" class="btn btn-primary">Reconnect</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
